<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>!function(){try{var d=JSON.parse(localStorage.getItem('studentHub_v2')||'{}');if(d&&d.user&&d.user.theme==='dark'){document.documentElement.classList.add('dark');}}catch(e){}}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات - Student Hub</title>
  <meta name="theme-color" content="#4648d4">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Google Fonts: Cairo & Tajawal / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen pb-28 md:pb-12 font-sans antialiased transition-colors">
  <div id="sh-header"></div>

  <main class="max-w-6xl mx-auto px-4 py-6 md:py-8 space-y-6">
    <!-- Header Row -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white" data-label-html="lecturesPageTitle">المحاضرات 🎬</h1>
      <button class="sh-btn primary shadow-sm flex items-center gap-2" data-label-html="newLectureBtn" onclick="Lectures.openForm()">
        <span>+ محاضرة جديدة</span>
      </button>
    </div>

    <!-- Filters -->
    <div class="mb-md overflow-x-auto whitespace-nowrap pb-2 scrollbar-hide">
      <div class="flex gap-2" id="day-filters">
        <button class="sh-filter active" data-day="all">الكل</button>
        <button class="sh-filter" data-day="0">الأحد</button>
        <button class="sh-filter" data-day="1">الإثنين</button>
        <button class="sh-filter" data-day="2">الثلاثاء</button>
        <button class="sh-filter" data-day="3">الأربعاء</button>
        <button class="sh-filter" data-day="4">الخميس</button>
        <button class="sh-filter" data-day="5">الجمعة</button>
        <button class="sh-filter" data-day="6">السبت</button>
      </div>
    </div>

    <!-- Subject Filter -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-xs font-bold text-slate-400">تصفية بالمواد:</span>
      <select id="lectures-subject" class="sh-input !w-auto !py-1 text-xs">
        <option value="all">كل المواد</option>
      </select>
    </div>

    <!-- Lecture List -->
    <div id="lectures-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>


  <script src="js/store.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lectures.js"></script>
</body>
</html>

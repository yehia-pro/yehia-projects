<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>!function(){try{var d=JSON.parse(localStorage.getItem('studentHub_v2')||'{}');if(d&&d.user&&d.user.theme==='dark'){document.documentElement.classList.add('dark');}}catch(e){}}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البطاقات التعليمية الذكية والتكرار المتباعد - Student Hub</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen pb-28 md:pb-12 font-sans antialiased transition-colors">
  <div id="sh-header"></div>

  <main class="max-w-4xl mx-auto px-4 py-6 md:py-8 space-y-6">

    <!-- Header Hero Banner -->
    <div class="sh-card p-6 md:p-8 rounded-3xl bg-gradient-to-r from-indigo-600/10 via-purple-600/10 to-transparent border border-indigo-500/20 flex flex-wrap items-center justify-between gap-4">
      <div class="space-y-1">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 text-xs font-black">
          <span>🧠</span>
          <span>نظام التكرار المتباعد (Spaced Repetition)</span>
        </div>
        <h2 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white">البطاقات التعليمية الذكية 🎴</h2>
        <p class="text-xs text-slate-500 max-w-md leading-relaxed">
          راجع المفاهيم والقوانين ومفردات القرآن واللغات بالبطاقات التفاعلية لترسيخها في الذاكرة طويلة المدى.
        </p>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="FlashcardsApp.openAddDeckModal()" class="px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md active:scale-95 transition-all flex items-center gap-1.5">
          <span>+</span>
          <span>مجموعة جديدة</span>
        </button>
      </div>
    </div>

    <!-- Main Flashcard Workspace -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Left Column: Decks List -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="font-black text-slate-900 dark:text-white text-sm">مجموعاتي التعليمية</h3>
          <button onclick="FlashcardsApp.openAddCardModal()" class="text-xs font-bold text-indigo-600 hover:underline">
            + بطاقة
          </button>
        </div>
        <div id="decks-list" class="space-y-2.5">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Right Column: Active Card Interactive Viewer -->
      <div class="md:col-span-2 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
          <h3 id="active-deck-title" class="font-black text-slate-900 dark:text-white text-base truncate">
            ...
          </h3>
          <div class="flex items-center gap-2 text-xs font-bold text-slate-500">
            <button onclick="FlashcardsApp.prevCard()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 active:scale-90 transition">➔</button>
            <span id="deck-cards-count" class="font-mono">1 / 1</span>
            <button onclick="FlashcardsApp.nextCard()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:bg-slate-200 active:scale-90 transition">←</button>
          </div>
        </div>

        <!-- Flipper Card Container -->
        <div id="flashcard-flipper"></div>

        <!-- Answer Actions -->
        <div id="flashcard-actions" class="pt-2"></div>
      </div>
    </div>

  </main>

  <!-- Add Deck Modal -->
  <div id="add-deck-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <h3 class="font-black text-slate-900 dark:text-white text-base">إنشاء مجموعة بطاقات جديدة 🎴</h3>
        <button onclick="FlashcardsApp.closeAddDeckModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 font-bold">✕</button>
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">اسم المجموعة:</label>
        <input type="text" id="new-deck-name" placeholder="مثلاً: فيزياء الفصل الأول / كلمات إنجليزي..." class="sh-input text-xs font-bold">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="FlashcardsApp.closeAddDeckModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500">إلغاء</button>
        <button onclick="FlashcardsApp.saveNewDeck()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md active:scale-95">إنشاء</button>
      </div>
    </div>
  </div>

  <!-- Add Card Modal -->
  <div id="add-card-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
        <h3 class="font-black text-slate-900 dark:text-white text-base">إضافة بطاقة جديدة 📝</h3>
        <button onclick="FlashcardsApp.closeAddCardModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 font-bold">✕</button>
      </div>
      <div class="space-y-3">
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">وجه البطاقة (السؤال / المفهوم / الكلمة):</label>
          <textarea id="card-front-input" rows="2" placeholder="اكتب السؤال أو المصطلح هنا..." class="sh-input text-xs font-medium"></textarea>
        </div>
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">ظهر البطاقة (الإجابة / التوضيح / القانون):</label>
          <textarea id="card-back-input" rows="3" placeholder="اكتب الإجابة أو المعنى هنا..." class="sh-input text-xs font-medium"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="FlashcardsApp.closeAddCardModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500">إلغاء</button>
        <button onclick="FlashcardsApp.saveNewCard()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md active:scale-95">+ حفظ البطاقة</button>
      </div>
    </div>
  </div>


  <script src="js/store.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/app.js"></script>
  <script src="js/flashcards.js"></script>
</body>
</html>

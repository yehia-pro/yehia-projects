<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>!function(){try{var d=JSON.parse(localStorage.getItem('studentHub_v2')||'{}');if(d&&d.user&&d.user.theme==='dark'){document.documentElement.classList.add('dark');}}catch(e){}}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدرسين - Student Hub</title>
  <meta name="theme-color" content="#4648d4">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Google Fonts: Cairo & Tajawal / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/custom.css">
  <style>
    .focus-zone { max-width: 960px; margin: 0 auto; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen pb-28 md:pb-12 font-sans antialiased transition-colors">
  <div id="sh-header"></div>

  <main class="focus-zone px-4 py-6 md:py-8 space-y-6">
    <!-- Page Header & Actions -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white" data-label="pageTitle">المدرسين 👨‍🏫</h2>
      <button class="sh-btn primary shadow-md flex items-center gap-2 w-full md:w-auto justify-center" data-label-html="newBtn" onclick="Teachers.openForm()">
        <span>+ مدرس جديد</span>
      </button>
    </div>

    <!-- Subject Filter -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-xs font-bold text-slate-400">تصفية بالمواد:</span>
      <select id="teachers-subject" class="sh-input !w-auto !py-1 text-xs">
        <option value="all">كل المواد</option>
      </select>
    </div>

    <!-- Teachers Grid -->
    <div id="teachers-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>


  <script src="js/store.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
  <script src="js/teachers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (L && L.applyAll) L.applyAll();
      document.title = L.get('pageTitle') + ' - Student Hub';
    });
  </script>
</body>
</html>

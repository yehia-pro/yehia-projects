<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark" style="background-color: #0B0F19; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <script>!function(){try{var d=JSON.parse(localStorage.getItem('studentHub_v2')||'{}');if(d&&d.user&&d.user.theme==='light'){document.documentElement.classList.remove('dark');document.documentElement.style.backgroundColor='#F8FAFC';document.documentElement.style.colorScheme='light';}}catch(e){}}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المركز الأكاديمي - Student Hub</title>
  <meta name="theme-color" content="#0B0F19">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-800 dark:text-slate-100 min-h-screen pb-12 font-sans antialiased" style="background-color: #0B0F19;">
  <div id="sh-header"></div>

  <main class="max-w-6xl mx-auto px-4 py-6 md:py-8 space-y-6">
    
    <!-- Hero Banner -->
    <div class="sh-card p-6 md:p-8 rounded-3xl bg-gradient-to-r from-blue-600/10 via-indigo-600/10 to-transparent border border-indigo-500/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="space-y-1">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 text-xs font-black">
          <span>📚</span>
          <span>المركز الأكاديمي المتكامل</span>
        </div>
        <h2 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white">المواد، الجدول، والمعلمون</h2>
        <p class="text-xs text-slate-500 max-w-lg leading-relaxed">
          نظم موادك الدراسية، جدول الحصص الأسبوعي، وأرقام المعلمين والسناتر في مكان واحد منظم.
        </p>
      </div>

      <!-- Action Button Area -->
      <div id="academic-actions" class="flex gap-2 shrink-0">
        <!-- Rendered dynamically depending on tab -->
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide" id="academic-tabs">
      <button onclick="Subjects.switchTab('subjects')" id="tab-btn-subjects" class="px-4 py-2.5 rounded-2xl text-xs md:text-sm font-black transition-all active:scale-95 bg-indigo-600 text-white shadow-md flex items-center gap-1.5 whitespace-nowrap">
        <span>🗂️</span>
        <span>المواد الدراسية</span>
      </button>
      <button onclick="Subjects.switchTab('schedule')" id="tab-btn-schedule" class="px-4 py-2.5 rounded-2xl text-xs md:text-sm font-black transition-all active:scale-95 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-1.5 whitespace-nowrap">
        <span>📅</span>
        <span>جدول الحصص الأسبوعي</span>
      </button>
      <button onclick="Subjects.switchTab('planets')" id="tab-btn-planets" class="px-4 py-2.5 rounded-2xl text-xs md:text-sm font-black transition-all active:scale-95 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-1.5 whitespace-nowrap">
        <span>🪐</span>
        <span>كواكب المعلمين واستوديو المجموعات</span>
      </button>
      <button onclick="Subjects.switchTab('teachers')" id="tab-btn-teachers" class="px-4 py-2.5 rounded-2xl text-xs md:text-sm font-black transition-all active:scale-95 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center gap-1.5 whitespace-nowrap">
        <span>👨‍🏫</span>
        <span>دليل المعلمين والسناتر</span>
      </button>
    </div>

    <!-- Main Dynamic Content Container -->
    <div id="academic-content" class="min-h-[300px]">
      <div id="subjects-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

  </main>

  <script src="js/store.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/prayer.js"></script>
  <script src="js/teacher-planet.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>
